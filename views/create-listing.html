<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sell Textbook - Second Chapter</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <header>
    <div class="container navbar">
      <a href="/" class="logo">📚 Second Chapter</a>
      <ul class="nav-links" id="nav-auth">
        <!-- Main.js navigation -->
      </ul>
    </div>
  </header>

  <main class="container">
    <div class="form-card" style="max-width: 650px;">
      <h2 style="text-align: center; margin-bottom: 8px; color: var(--primary-color);">Create Used Book Listing</h2>
      <p style="text-align: center; color: var(--text-muted); margin-bottom: 25px;">Provide clear textbook details and a real photo for admin verification.</p>

      <div id="listing-alert"></div>

      <form id="create-listing-form" enctype="multipart/form-data">
        <div class="form-group">
          <label for="title">Book Title</label>
          <input type="text" id="title" name="title" class="form-control" placeholder="e.g., Data Structures and Algorithms" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="author">Author(s)</label>
            <input type="text" id="author" name="author" class="form-control" placeholder="e.g., Mark Allen Weiss" required>
          </div>
          <div class="form-group">
            <label for="edition">Edition</label>
            <input type="text" id="edition" name="edition" class="form-control" placeholder="e.g., 4th Edition" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="department">Department</label>
            <select id="department" name="department" class="form-control" required>
              <option value="">Select Department</option>
              <option value="Computer Science">Computer Science</option>
              <option value="Engineering">Engineering</option>
              <option value="Business">Business</option>
              <option value="Mathematics">Mathematics</option>
              <option value="Physics">Physics</option>
              <option value="Chemistry">Chemistry</option>
              <option value="Biology">Biology</option>
            </select>
          </div>
          <div class="form-group">
            <label for="semester">Semester</label>
            <select id="semester" name="semester" class="form-control" required>
              <option value="">Select Semester</option>
              <option value="Spring 2026">Spring 2026</option>
              <option value="Fall 2025">Fall 2025</option>
              <option value="Summer 2025">Summer 2025</option>
              <option value="Spring 2025">Spring 2025</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="condition">Book Condition</label>
            <select id="condition" name="condition" class="form-control" required>
              <option value="">Select Condition</option>
              <option value="New">New</option>
              <option value="Like New">Like New</option>
              <option value="Good">Good</option>
              <option value="Fair">Fair</option>
              <option value="Poor">Poor</option>
            </select>
          </div>
          <div class="form-group">
            <label for="price">Asking Price (৳)</label>
            <input type="number" id="price" name="price" class="form-control" placeholder="e.g., 1200" step="1" min="0" required>
          </div>
        </div>

        <div class="form-group">
          <label for="photo">Book Photo (Condition Verification)</label>
          <input type="file" id="photo" name="photo" class="form-control" accept="image/jpeg,image/png,image/webp" required>
          <small style="color: #7f8c8d;">Upload a clear picture of the physical textbook cover and pages.</small>
        </div>

        <button type="submit" class="btn btn-secondary" style="width: 100%; margin-top: 15px;">Submit Listing for Verification</button>
      </form>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2026 Second Chapter University Marketplace</p>
    </div>
  </footer>

  <script src="/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Redirect if not logged in
      fetch('/api/auth/me').then(r => r.json()).then(data => {
        if (!data.loggedIn) {
          alert('You must be logged in to sell a book.');
          window.location.href = '/login?redirect=/create-listing';
        }
      });

      const form = document.getElementById('create-listing-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(form);

        try {
          const res = await fetch('/api/books', {
            method: 'POST',
            body: formData
          });

          const data = await res.json();

          if (data.success) {
            showAlert('listing-alert', data.message, 'success');
            setTimeout(() => {
              window.location.href = '/dashboard';
            }, 1200);
          } else {
            showAlert('listing-alert', data.message, 'error');
          }
        } catch (err) {
          showAlert('listing-alert', 'Upload error: ' + err.message, 'error');
        }
      });
    });
  </script>
</body>
</html>
